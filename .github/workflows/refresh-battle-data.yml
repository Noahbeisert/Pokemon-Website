name: Refresh Doubles battle data

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Pull battle data from championsbattledata.com
        run: |
          python dump_index.py
          python fetch_battle_rows.py
          python build_pokemon_json.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pokemon_data.json
          git diff --cached --quiet || git commit -m "Daily doubles battle data refresh"
          git push
